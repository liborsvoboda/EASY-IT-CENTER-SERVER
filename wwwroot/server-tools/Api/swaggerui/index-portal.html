<!-- HTML for static distribution bundle build -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Swagger UI</title>
    <link rel="stylesheet" type="text/css" href="./Code/css/swagger-ui.css" />
    <link rel="stylesheet" type="text/css" href="./Code/css/index.css" />
    <link rel="icon" type="image/png" href="./Code/js/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./Code/js/favicon-16x16.png" sizes="16x16" />
  </head>

  <body>
      <div id="swagger-ui"></div>
      <script type="text/javascript" src="./Code/js/swagger-ui-bundle.js" charset="UTF-8"></script>
      <script type="text/javascript" src="./Code/js/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
      <script type="text/javascript" src="./Code/js/swagger-initializer.js" charset="UTF-8"></script>
	  <script type="text/javascript" src="./Code/js/jquery-3.6.0.min.js"></script>
      <script type="text/javascript" src="./Code/js/metro.4.5.2.min.js"></script>
      <script>
          window.onload = () => {
              window.ui = SwaggerUIBundle({
                  url: `${Metro.storage.getItem('BackendServerAddress', null)}/swagger/${Metro.storage.getItem('ServerVersion', null) }/swagger.json`,
                  dom_id: "#swagger-ui",
                  /*presets: [
                      SwaggerUIBundle.presets.apis,
                      SwaggerUIStandalonePreset
                    ],
                    layout: "StandaloneLayout",
                  */
              });
          };
      </script>
  </body>
</html>
